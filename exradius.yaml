version: 2

project:
  slug: otr-shop
  name: otr-shop
  description: E-commerce store for a customer support agent. Medusa 2 backend and admin, Next.js storefront, TypeScript on Node 24 with npm and Turborepo, Postgres.

secret_store: otr-shop

repositories:
  - name: otr-shop
    url: https://github.com/musabeytekin/otr-shop.git
    branch: main
    credential: "${secret:GITHUB_TOKEN}"
    push: true

workstations:
  development:
    dockerfile: docker/workstation.Dockerfile

services:
  postgres:
    image: postgres:17
    env:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: otr_shop
    ports: [5432]
    ready:
      command: [pg_isready, -h, 127.0.0.1, -U, medusa, -d, otr_shop]

notes: |
  AGENTS.md at the root of otr-shop is the team's guide (directory map, Medusa conventions,
  off-limits paths); follow it. The package manager is npm (packageManager npm@11.17.0):
  never create another lockfile. Install dependencies inside the app that needs them
  (`cd apps/backend && npm install <pkg>`); registry.npmjs.org is reachable. Medusa
  packages ship an AGENTS.md under node_modules/@medusajs/<pkg>/ for the installed
  version; read it before using an API. The Medusa skills and docs MCP server the guide
  mentions are not available here.

  Two environments. `development` (the developer agent) has the dependencies installed,
  the postgres service, the browser and the allowed hosts; everything below this
  paragraph about installing, checks, the database and running the application
  describes it. `source` (the scout agent) has only a clone of otr-shop on a plain
  image: no Node, no node_modules, no database, no running application and no network
  beyond the repository. There, answer from the source and the git history, and say so
  when a question could only be settled by running the code.

  Checks, from /work/otr-shop:
  - Backend lint: `cd apps/backend && npm run lint` (medusa lint; passes on main).
  - Storefront lint: one folder or file, `cd apps/storefront && npx eslint src/modules/products`.
    The full `npx eslint .` (and so the root `npm run lint`) already fails on main with
    10 errors in src/lib/data/cart.ts and src/modules/layout/components/language-select;
    do not count those against your change, and do not fix them unless the ticket asks.
  - Backend build: `cd apps/backend && npm run build` (about 15 s, compiles the server
    and the admin dashboard).
  - Tests: there are no test files yet. The suites are `npm run test:unit`,
    `test:integration:modules` and `test:integration:http` in apps/backend (Jest, run
    in band); add `--passWithNoTests` or the empty suite exits 1. One file:
    `npm run test:unit -- <path>`. Integration suites would run against the postgres service (none exist, so this is unproven).
  - There is no CI and no storefront test suite.

  Database: setup migrated and seeded the development database (otr_shop on the postgres
  service: one region Europe with dk, de, gb, se, fr, es, it, four demo products) and
  created the admin user admin@test.com / supersecret. `psql "$DATABASE_URL"` works.
  After changing a custom module's model run `npx medusa db:generate <module>` then
  `npx medusa db:migrate` in apps/backend; never edit an existing migration.
  DATABASE_URL must keep localhost as its host: Medusa turns SSL on for any other host,
  and the connection then times out.

  Running the app (to reproduce a bug or see a change; the checks do not need it):
  `cd apps/backend && npm run dev > /tmp/backend.log 2>&1 &`, wait until
  http://localhost:9000/health answers (seconds). Admin dashboard at
  http://localhost:9000/app (admin@test.com / supersecret); store API calls need the
  header `x-publishable-api-key`, whose value setup wrote to apps/storefront/.env.local;
  an admin token comes from `POST /auth/user/emailpass` with that login. Then
  `cd apps/storefront && npm run dev > /tmp/storefront.log 2>&1 &`: the storefront is on
  http://localhost:8000/dk (pages compile on first request, a few seconds), the shop at
  /dk/store, a product at /dk/products/sweatshirt. Look at pages with the browser tool
  on those URLs.
  Product images are on medusa-public-images.s3.eu-west-1.amazonaws.com, which is
  reachable, so pages and screenshots show them. Stop both with
  `pkill -f "medusa develop|cli.js start|next dev|next-server"` (each dev command
  leaves a child server behind when only its parent is killed).

  Delivery: one pull request against main per ticket. Commit messages and code have no
  emojis; code style is in AGENTS.md (no semicolons, double quotes, kebab-case files).

connections:
  github:
    catalog: github
    config:
      token: "${secret:GITHUB_TOKEN}"
  playwright:
    catalog: playwright

environments:
  # Develops, checks and runs the application: the clone with its dependencies installed,
  # a migrated and seeded database, a browser for the playwright connection.
  development:
    repositories: [otr-shop]
    workstation: development
    services: [postgres]
    connections: [github, playwright]
    setup:
      - cd otr-shop && npm ci
      - cd otr-shop/apps/backend && npx medusa db:migrate
      - cd otr-shop/apps/backend && npx medusa user -e admin@test.com -p supersecret
      - >-
        cd otr-shop/apps/storefront &&
        KEY=$(psql "$DATABASE_URL" -Atc "select token from api_key where type = 'publishable' and revoked_at is null order by created_at limit 1") &&
        test -n "$KEY" && echo "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$KEY" > .env.local
      - npx -y @playwright/mcp@0.0.83 install-browser chromium
    cache:
      - ~/.npm
      - ~/.cache/ms-playwright
    resources:
      memory: 7g
    env:
      # localhost, not the service name: Medusa turns SSL on for any other database host.
      DATABASE_URL: postgres://medusa:medusa@localhost:5432/otr_shop
      DB_NAME: otr_shop
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:5173,http://localhost:9000
      AUTH_CORS: http://localhost:5173,http://localhost:9000
      JWT_SECRET: supersecret
      COOKIE_SECRET: supersecret
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_DISABLE_TELEMETRY: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    network:
      allow:
        - registry.npmjs.org
        # the seeded demo products' images, so pages and screenshots show them
        - medusa-public-images.s3.eu-west-1.amazonaws.com
  # Reads the source: a clone on the install's default image. No dependencies, database,
  # application or connections.
  source:
    repositories: [otr-shop]

agents:
  developer:
    name: Developer
    environment: development
    role: |
      You take tickets that ask for a change to the code: bug fixes, features, refactors,
      dependency updates, in the Medusa backend, its admin dashboard or the Next.js
      storefront. Keep the change small and follow AGENTS.md and the conventions you find.
      Before you finish, run the checks the notes give for what you touched (the backend
      lint for backend code, the storefront lint on the files you changed, the backend
      build when you changed backend or admin code, the tests that cover it), and say in
      your result which you ran and what they showed; if one could not run, say why.
      When the change can be seen in the running application (a storefront or admin
      page looks or behaves differently, a store or admin API endpoint answers
      differently), the tests are not the whole proof: start the application as the
      notes say and look at your change there the way the person who asked would. Open
      the page with the browser tool, do what the ticket describes, and take a screenshot
      of the state that shows it works (for a bug: of what was wrong, now right). Save
      each screenshot under a file name of its own in the project directory, not inside
      a repository, so that no commit picks it up. Attach the screenshots to your result
      and say in a line each what they show. For an endpoint, quote the request and the
      response instead. A change nothing in the running application shows (a refactor, a
      dependency update, tests, documentation) needs none of this: say that the checks
      are its proof. If you could not start the application or reach your change in it,
      say what stopped you; never describe as seen what you did not see.
      After pushing, open a pull request against main with the GitHub tool and link it in
      your result.
  scout:
    name: Scout
    environment: source
    role: |
      You take tickets that ask a question about the code or the store's behaviour: where
      something is, why something happens, what a change would affect. You investigate
      by reading the code and its git history, and report findings with file paths and
      evidence. Your environment is a clone of the repository only: you cannot install
      dependencies, start the application or query a database, so when a question can
      only be settled by running the code, say that and give what the source shows. You
      never change code, push or open pull requests.
